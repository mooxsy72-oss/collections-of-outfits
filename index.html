<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1d">
  <title>Коллекция нарядов by Mooxsy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
<header>
  <div class="gender-switch">
    <button class="gender-btn active" data-gender="all" title="Показать всё">✦</button>
    <button class="gender-btn" data-gender="female" title="Женское">♀</button>
    <button class="gender-btn" data-gender="male" title="Мужское">♂</button>
  </div>
  <h1>Коллекция нарядов by Mooxsy</h1>
  <button class="themes-btn" id="themesBtn">Мои темы</button>
</header>

  <!-- ── Фильтр по категориям ── -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все наряды</button>
    <button class="filter-btn" data-filter="slavic">Славянское</button>
    <button class="filter-btn" data-filter="folk">Историческое</button>
    <button class="filter-btn" data-filter="modern">Современные</button>
    <button class="filter-btn" data-filter="elegant">Элегантное</button>
    <button class="filter-btn" data-filter="ball">Бальное🎭</button>
    <button class="filter-btn" data-filter="rusreal">Rusreal🚬</button>
    <button class="filter-btn" data-filter="kawaii">Kawaii🌸</button>
    <button class="filter-btn" data-filter="witch">Witch🐈‍⬛</button>
    <button class="filter-btn" data-filter="winx">Winx🧚‍♂️</button>
    <button class="filter-btn" data-filter="knightcore">Knight core⚔️</button>
    <button class="filter-btn" data-filter="Angel">Angel👼</button>
    <button class="filter-btn" data-filter="sexy">Sassy💋</button>
    <button class="filter-btn" data-filter="zazerkalye">Зазеркалье🎩</button>
    <button class="filter-btn" data-filter="postapoc">Постапокалипсис🧟‍♀️</button>
    <button class="filter-btn" data-filter="scifi">sci-fi🛸</button>
    <button class="filter-btn" data-filter="savage">Savage⚒️</button>
    <button class="filter-btn" data-filter="fantasy">Разное</button>
  </div>

  <!-- ── Галерея ── -->
  <div class="gallery" id="gallery"></div>

  <!-- ── Кнопка "Загрузить ещё" ── -->
  <div class="load-more-wrapper">
    <button class="btn-load-more hidden" id="loadMoreBtn">Загрузить ещё</button>
  </div>

  <!-- ── Модальное окно ── -->
  <div class="modal" id="modal">
    <!-- стрелки вынесены наружу контента, ближе к краям экрана -->
    <button class="modal-nav modal-nav-prev" id="modalNavPrev">‹</button>
    <button class="modal-nav modal-nav-next" id="modalNavNext">›</button>

    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>

      <div class="modal-left">
        <div class="modal-img-wrapper" id="modalImgWrapper">
          <img id="modalImg" src="" alt="наряд">
        </div>
      </div>

      <div class="modal-right">
        <div class="modal-prompt-box" id="modalPrompt">Загрузка...</div>
        <div class="modal-footer">
          <button class="btn-copy-modal" id="btnCopyModal"><span>Скопировать</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Панель тем ── -->
  <div class="themes-panel" id="themesPanel">
    <div class="themes-backdrop" id="themesBackdrop"></div>
    <div class="themes-drawer">
      <div class="themes-drawer-head">
        <h2>Мои темы для SillyTavern</h2>
        <button class="themes-close" id="themesClose">✕</button>
      </div>
      <div class="themes-grid" id="themesGrid"></div>
    </div>
  </div>

  <script src="main.js"></script>
<script>
(function () {
    if (window.parent === window) return; // прямое открытие сайта — скрипт молчит

    var moreClicks = 0;
    var restoring  = false;

    // ищем активный тег: сначала по классу/атрибуту, иначе по последнему клику
    var lastTagText = '';

    function findActiveTag() {
        var sel = [
            '.tag.active', '.tag.selected', '.tag.is-active',
            '.filter.active', '.filter-btn.active',
            '[data-tag].active', '[data-tag][aria-selected="true"]',
            'button.active', '.chip.active'
        ];
        for (var i = 0; i < sel.length; i++) {
            var el = document.querySelector(sel[i]);
            if (el && el.textContent.trim()) return el.textContent.trim();
        }
        return lastTagText;
    }

    function findMoreBtn() {
        var all = document.querySelectorAll('button, a, div, span');
        for (var i = 0; i < all.length; i++) {
            var t = all[i].textContent.trim();
            if (t === 'Загрузить ещё' || t === 'Загрузить еще') return all[i];
        }
        return null;
    }

    function send() {
        if (restoring) return;
        try {
            window.parent.postMessage({
                nwOutfits: true,
                hash:   location.hash || '',
                search: location.search || '',
                scroll: window.scrollY || document.documentElement.scrollTop || 0,
                tag:    findActiveTag(),
                more:   moreClicks
            }, '*');
        } catch (e) { /* пофиг */ }
    }

    var t = null;
    function sendLater(ms) {
        clearTimeout(t);
        t = setTimeout(send, ms || 250);
    }

    window.addEventListener('scroll', function () { sendLater(280); }, { passive: true });
    window.addEventListener('hashchange', function () { sendLater(80); });

    document.addEventListener('click', function (e) {
        var el = e.target.closest('button, a, [data-tag], .tag, .chip, .filter, li');
        if (!el) return;
        var txt = el.textContent.trim();

        if (txt === 'Загрузить ещё' || txt === 'Загрузить еще') {
            moreClicks++;
        } else if (txt && txt.length < 40) {
            lastTagText = txt;
            moreClicks = 0; // сменила тег — счётчик подгрузок обнуляем
        }
        sendLater(200);
    }, true);

    /* ---- восстановление по команде из расширения ---- */

    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.nwOutfitsRestore !== true) return;

        restoring = true;
        moreClicks = 0;

        // 1) тег
        if (d.tag) {
            var cands = document.querySelectorAll('button, a, [data-tag], .tag, .chip, .filter, li');
            for (var i = 0; i < cands.length; i++) {
                if (cands[i].textContent.trim() === d.tag) {
                    cands[i].click();
                    lastTagText = d.tag;
                    break;
                }
            }
        }

        // 2) подгрузка порциями, потом скролл
        var need = typeof d.more === 'number' ? d.more : 0;
        var done = 0;

        function step() {
            if (done < need) {
                var btn = findMoreBtn();
                if (btn) {
                    btn.click();
                    done++;
                    moreClicks++;
                    setTimeout(step, 220);
                    return;
                }
            }
            var y = typeof d.scroll === 'number' ? d.scroll : 0;
            setTimeout(function () { window.scrollTo(0, y); }, 120);
            setTimeout(function () { window.scrollTo(0, y); }, 600);
            setTimeout(function () { restoring = false; }, 900);
        }

        setTimeout(step, d.tag ? 320 : 60);
    });

    send();
})();
</script>
  <style>
@media (max-width: 760px) {
    .nw-tags-wrap {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 7px !important;
        max-height: 32px;
        overflow: hidden;
        padding: 0 8px !important;
        transition: max-height 0.3s ease;
    }

    .nw-tags-wrap.nw-tags-open {
        max-height: 46vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .nw-tags-wrap > * {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 30px !important;
        padding: 0 13px !important;
        font-size: 11.5px !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        flex: 0 0 auto !important;
    }

    .nw-tags-wrap > [data-nw-active] {
        order: -1 !important;
    }

    .nw-tags-more {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: fit-content;
        margin: 8px auto 4px;
        padding: 6px 16px;
        font-size: 11px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: currentColor;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        opacity: 0.82;
        transition: opacity 0.18s ease, background 0.18s ease;
    }

    .nw-tags-more:active {
        opacity: 1;
        background: rgba(255, 255, 255, 0.12);
    }

    .nw-tags-more::after {
        content: '▾';
        font-size: 10px;
        transition: transform 0.24s ease;
    }

    .nw-tags-more.nw-tags-more-open::after {
        transform: rotate(180deg);
    }
}

@media (min-width: 761px) {
    .nw-tags-more {
        display: none !important;
    }
}
</style>

<script>
(function () {
    'use strict';

    var ACTIVE_HINTS = ['active', 'selected', 'current', 'is-active', 'on'];

    function findRow() {
        var all = document.querySelectorAll('button, a, div, span, li');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el.children.length) continue;
            var t = (el.textContent || '').trim().toLowerCase();
            if (t !== 'все наряды') continue;
            var p = el;
            for (var up = 0; up < 4 && p; up++) {
                p = p.parentElement;
                if (p && p.children.length >= 5) return p;
            }
        }
        return null;
    }

    function looksActive(el) {
        var cls = (el.className || '').toString().toLowerCase();
        for (var i = 0; i < ACTIVE_HINTS.length; i++) {
            if (cls.indexOf(ACTIVE_HINTS[i]) !== -1) return true;
        }
        return el.getAttribute('aria-selected') === 'true';
    }

    function init() {
        var row = findRow();
        if (!row || row.classList.contains('nw-tags-wrap')) return !!row;

        row.classList.add('nw-tags-wrap');

        var more = document.createElement('div');
        more.className = 'nw-tags-more';
        more.setAttribute('role', 'button');
        more.setAttribute('data-nw-skip', '1');
        row.parentNode.insertBefore(more, row.nextSibling);

        function count() {
            var n = 0;
            for (var i = 0; i < row.children.length; i++) {
                if (row.children[i].offsetParent !== null || true) n++;
            }
            return n;
        }

        function label() {
            more.textContent = row.classList.contains('nw-tags-open')
                ? 'Свернуть'
                : 'Ещё ' + Math.max(0, count() - 3);
        }

        function markActive() {
            var found = null;
            for (var i = 0; i < row.children.length; i++) {
                var c = row.children[i];
                c.removeAttribute('data-nw-active');
                if (!found && looksActive(c)) found = c;
            }
            if (found) found.setAttribute('data-nw-active', '1');
        }

        more.addEventListener('click', function (e) {
            e.stopPropagation();
            row.classList.toggle('nw-tags-open');
            more.classList.toggle('nw-tags-more-open', row.classList.contains('nw-tags-open'));
            label();
        });

        row.addEventListener('click', function (e) {
            var chip = e.target;
            while (chip && chip.parentElement !== row) chip = chip.parentElement;
            if (!chip) return;
            for (var i = 0; i < row.children.length; i++) {
                row.children[i].removeAttribute('data-nw-active');
            }
            chip.setAttribute('data-nw-active', '1');
            setTimeout(function () {
                row.classList.remove('nw-tags-open');
                more.classList.remove('nw-tags-more-open');
                label();
            }, 140);
        });

        markActive();
        label();

        // теги могут дорисоваться позже — следим за составом ряда
        if (window.MutationObserver) {
            new MutationObserver(function () {
                markActive();
                label();
            }).observe(row, { childList: true, attributes: true, subtree: true });
        }

        window.addEventListener('resize', label);
        return true;
    }

    function boot() {
        if (init()) return;
        var tries = 0;
        var iv = setInterval(function () {
            if (init() || ++tries > 40) clearInterval(iv);
        }, 250);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
</body>
</html>
