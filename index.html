<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1d">
  <title>Коллекция нарядов by Mooxsy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
<header>
  <div class="gender-switch">
    <button class="gender-btn active" data-gender="all" title="Показать всё">✦</button>
    <button class="gender-btn" data-gender="female" title="Женское">♀</button>
    <button class="gender-btn" data-gender="male" title="Мужское">♂</button>
  </div>
  <h1>Коллекция нарядов by Mooxsy</h1>
  <button class="themes-btn" id="themesBtn">Мои темы</button>
</header>

  <!-- ── Фильтр по категориям ── -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все наряды</button>
    <button class="filter-btn" data-filter="slavic">Славянское</button>
    <button class="filter-btn" data-filter="folk">Историческое</button>
    <button class="filter-btn" data-filter="modern">Современные</button>
    <button class="filter-btn" data-filter="elegant">Элегантное</button>
    <button class="filter-btn" data-filter="ball">Бальное🎭</button>
    <button class="filter-btn" data-filter="rusreal">Rusreal🚬</button>
    <button class="filter-btn" data-filter="kawaii">Kawaii🌸</button>
    <button class="filter-btn" data-filter="witch">Witch🐈‍⬛</button>
    <button class="filter-btn" data-filter="winx">Winx🧚‍♂️</button>
    <button class="filter-btn" data-filter="knightcore">Knight core⚔️</button>
    <button class="filter-btn" data-filter="Angel">Angel👼</button>
    <button class="filter-btn" data-filter="sexy">Sassy💋</button>
    <button class="filter-btn" data-filter="zazerkalye">Зазеркалье🎩</button>
    <button class="filter-btn" data-filter="postapoc">Постапокалипсис🧟‍♀️</button>
    <button class="filter-btn" data-filter="scifi">sci-fi🛸</button>
    <button class="filter-btn" data-filter="savage">Savage⚒️</button>
    <button class="filter-btn" data-filter="fantasy">Разное</button>
  </div>

  <!-- ── Галерея ── -->
  <div class="gallery" id="gallery"></div>

  <!-- ── Кнопка "Загрузить ещё" ── -->
  <div class="load-more-wrapper">
    <button class="btn-load-more hidden" id="loadMoreBtn">Загрузить ещё</button>
  </div>

  <!-- ── Модальное окно ── -->
  <div class="modal" id="modal">
    <!-- стрелки вынесены наружу контента, ближе к краям экрана -->
    <button class="modal-nav modal-nav-prev" id="modalNavPrev">‹</button>
    <button class="modal-nav modal-nav-next" id="modalNavNext">›</button>

    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>

      <div class="modal-left">
        <div class="modal-img-wrapper" id="modalImgWrapper">
          <img id="modalImg" src="" alt="наряд">
        </div>
      </div>

      <div class="modal-right">
        <div class="modal-prompt-box" id="modalPrompt">Загрузка...</div>
        <div class="modal-footer">
          <button class="btn-copy-modal" id="btnCopyModal"><span>Скопировать</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Панель тем ── -->
  <div class="themes-panel" id="themesPanel">
    <div class="themes-backdrop" id="themesBackdrop"></div>
    <div class="themes-drawer">
      <div class="themes-drawer-head">
        <h2>Мои темы для SillyTavern</h2>
        <button class="themes-close" id="themesClose">✕</button>
      </div>
      <div class="themes-grid" id="themesGrid"></div>
    </div>
  </div>

  <script src="main.js"></script>
<script>
(function () {
  if (window.parent === window) return; // открыт напрямую — молчим

  var restoring = false;

  function readState() {
    var s = { filter: 'all', gender: 'all', count: 40, scroll: 0 };
    try { s.filter = currentFilter; } catch (e) {}
    try { s.gender = currentGender; } catch (e) {}
    try { s.count  = displayedCount; } catch (e) {}
    s.scroll = window.scrollY || document.documentElement.scrollTop || 0;
    return s;
  }

  function send() {
    if (restoring) return;
    var s = readState();
    s.nwOutfits = true;
    try { window.parent.postMessage(s, '*'); } catch (e) {}
  }

  var t = null;
  function sendLater(ms) {
    clearTimeout(t);
    t = setTimeout(send, ms || 260);
  }

  window.addEventListener('scroll', function () { sendLater(300); }, { passive: true });

  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-nw-skip]')) return;
    if (e.target.closest('.filter-btn, .gender-btn, #loadMoreBtn')) sendLater(220);
  }, true);

  function syncButtons(state) {
    var f = document.querySelectorAll('.filter-btn[data-filter]');
    for (var i = 0; i < f.length; i++) {
      f[i].classList.toggle('active', f[i].dataset.filter === state.filter);
    }
    var g = document.querySelectorAll('.gender-btn');
    for (var j = 0; j < g.length; j++) {
      g[j].classList.toggle('active', g[j].dataset.gender === state.gender);
    }
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.nwOutfitsRestore !== true) return;

    restoring = true;

    var apply = function () {
      try {
        if (typeof d.filter === 'string') currentFilter = d.filter;
        if (typeof d.gender === 'string') currentGender = d.gender;
        if (typeof d.count  === 'number') displayedCount = Math.max(40, d.count);
        renderGallery();
        syncButtons(d);
      } catch (err) { /* глобалы недоступны — просто вернём скролл */ }

      var y = typeof d.scroll === 'number' ? d.scroll : 0;
      // высота документа уже верная: у карточек задан aspect-ratio
      window.scrollTo(0, y);
      setTimeout(function () { window.scrollTo(0, y); }, 90);
      setTimeout(function () { window.scrollTo(0, y); }, 400);
      setTimeout(function () { restoring = false; }, 700);
    };

    // ждём, пока outfits.json подгрузится
    var tries = 0;
    (function wait() {
      var ready = false;
      try { ready = Array.isArray(outfits) && outfits.length > 0; } catch (err) { ready = true; }
      if (ready || ++tries > 40) apply();
      else setTimeout(wait, 100);
    })();
  });

  send();
})();
</script>

<script>
(function () {
  'use strict';

  var VISIBLE = 3;

  var css = ''
    + '.nw-tags-more{display:none;align-items:center;justify-content:center;gap:.4rem;'
    + 'width:fit-content;margin:.55rem auto .15rem;padding:.42rem 1.15rem;border-radius:999px;'
    + 'border:1px solid rgba(201,168,76,.3);background:transparent;color:var(--gold);'
    + "font-family:'Jost',sans-serif;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;"
    + 'cursor:pointer;-webkit-tap-highlight-color:transparent;'
    + 'transition:background .25s ease,color .25s ease,border-color .25s ease}'
    + ".nw-tags-more::after{content:'\\25BE';font-size:.6rem;line-height:1;transition:transform .25s ease}"
    + '.nw-tags-more.nw-open::after{transform:rotate(180deg)}'
    + '.nw-tags-more:active{background:var(--gold);color:var(--bg-deep);border-color:var(--gold)}'
    + '@media (max-width:760px){'
    + '.nw-tags-more{display:inline-flex}'
    + '.filters{padding:.85rem .6rem .15rem;gap:.4rem;border-bottom:none}'
    + '.nw-tags-more-wrap{padding-bottom:.6rem;border-bottom:1px solid var(--border-soft);text-align:center}'
    + '.filters .filter-btn{padding:.38rem .78rem;font-size:.65rem;letter-spacing:.05em;line-height:1.15}'
    + '.filters .filter-btn.active{order:-1}'
    + '.filters.nw-collapsed .filter-btn[data-nw-hide]{display:none}'
    + '}';

  var st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  function init() {
    var row = document.querySelector('.filters');
    if (!row || row.dataset.nwReady) return;
    row.dataset.nwReady = '1';

    var wrap = document.createElement('div');
    wrap.className = 'nw-tags-more-wrap';

    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'nw-tags-more';
    more.setAttribute('data-nw-skip', '1');

    wrap.appendChild(more);
    row.parentNode.insertBefore(wrap, row.nextSibling);

    function apply() {
      var list = row.querySelectorAll('.filter-btn');
      var shown = 0, hidden = 0;

      for (var i = 0; i < list.length; i++) {
        var chip = list[i];
        if (chip.classList.contains('active') || shown < VISIBLE) {
          shown++;
          chip.removeAttribute('data-nw-hide');
        } else {
          hidden++;
          chip.setAttribute('data-nw-hide', '1');
        }
      }

      var collapsed = row.classList.contains('nw-collapsed');
      more.textContent = collapsed ? ('Ещё ' + hidden) : 'Свернуть';
      more.classList.toggle('nw-open', !collapsed);
      wrap.style.display = (list.length > VISIBLE) ? '' : 'none';
    }

    more.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      row.classList.toggle('nw-collapsed');
      apply();
    });

    row.addEventListener('click', function (e) {
      if (!e.target.closest || !e.target.closest('.filter-btn')) return;
      row.classList.add('nw-collapsed');
      setTimeout(apply, 0);
    });

    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(apply, 140);
    });

    row.classList.add('nw-collapsed');
    apply();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
